    <script>
      // Suppress Vite dev WebSocket closure errors in AI Studio iframe proxy
      (function() {
        var isWsError = function(val) {
          var s = String((val && (val.message || val.stack || val)) || '').toLowerCase();
          return s.includes('websocket') || s.includes('@vite/client') || s.includes('ws:') || s.includes('closed without opened');
        };
        window.addEventListener('unhandledrejection', function(e) {
          if (isWsError(e && e.reason)) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(e) {
          if (isWsError(e && (e.error || e.message))) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
